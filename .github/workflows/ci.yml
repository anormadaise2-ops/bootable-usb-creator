name: Build and test

on:
  push:
    branches:
      - main
      - anormadaise2-ops-bootable-usb-creator
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run focused core tests
        run: dotnet run --project tests/Zercraft.Tests/Zercraft.Tests.csproj --configuration Release
      - name: Build desktop app
        run: dotnet build src/Zercraft.App/Zercraft.App.csproj --configuration Release
